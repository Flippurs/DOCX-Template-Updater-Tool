<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HMH - Template Updater</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="HMH color LOGO.jpg" alt="HMH Logo" class="logo">
        </div>
        <h1>Template Updater</h1>
        <p class="subtitle">Update document formatting without changing text content</p>

        <div class="type-selector" id="typeSelector">
            <button class="type-btn active" data-type="docx">📄 Word</button>
            <button class="type-btn" data-type="pptx">📊 PowerPoint</button>
            <button class="type-btn" data-type="xlsx">📈 Excel</button>
        </div>

        <div class="drop-zones">
            <div class="drop-zone" id="templateZone">
                <div class="drop-zone-icon" id="templateIcon">📄</div>
                <div class="drop-zone-text" id="templateText">Drag & Drop Template DOCX</div>
                <div class="drop-zone-hint" id="templateHint">This is your modern template</div>
                <div class="file-list" id="templateFiles"></div>
            </div>

            <div class="drop-zone" id="targetZone">
                <div class="drop-zone-icon" id="targetIcon">📁</div>
                <div class="drop-zone-text" id="targetText">Drag & Drop Target DOCX Files</div>
                <div class="drop-zone-hint" id="targetHint">Files to update (single or batch)</div>
                <div class="file-list" id="targetFiles"></div>
            </div>
        </div>

        <button id="updateBtn" class="update-btn" disabled>Update Documents</button>

        <div class="quote-box" id="quoteBox">
            <span class="quote-icon">💡</span>
            <span class="quote-text" id="quoteText">Drop your files and hit update!</span>
        </div>

        <div class="status" id="status"></div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
